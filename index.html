<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍳 RecipeJS</h1>
        <p>Your Functional Cooking Companion</p>
    </header>
    <main>
        <section class="controls" aria-label="Recipe filters and sorting">
            <div class="control-group">
                <h2>Filter Recipes</h2>
                <div class="button-group">
                    <button class="filter-btn active" data-filter="all">All Recipes</button>
                    <button class="filter-btn" data-filter="easy">Easy Recipes</button>
                    <button class="filter-btn" data-filter="medium">Medium Recipes</button>
                    <button class="filter-btn" data-filter="hard">Hard Recipes</button>
                    <button class="filter-btn" data-filter="quick">Quick Recipes</button>
                </div>
            </div>
            <div class="control-group">
                <h2>Sort Recipes</h2>
                <div class="button-group">
                    <button class="sort-btn active" data-sort="none">Default Order</button>
                    <button class="sort-btn" data-sort="name">Name (A-Z)</button>
                    <button class="sort-btn" data-sort="time">Time (Fastest First)</button>
                </div>
            </div>
        </section>
        <div id="recipe-container">
            <!-- Recipe cards will be rendered here by JavaScript -->
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
